<!DOCTYPE html>
<html lang="zh-CN" data-project-name="木之本樱 &amp; 小可">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>木之本樱 &amp; 小可 - 3840×2400 交互式动态壁纸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121018;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* 控制面板 */
    .ui-toggle-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .ui-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.38);
      transform: scale(1.1) rotate(30deg);
    }
    .control-panel {
      position: fixed;
      top: 80px;
      right: 24px;
      width: 290px;
      max-height: calc(100vh - 104px);
      overflow-y: auto;
      background: rgba(26, 20, 32, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 183, 197, 0.3);
      border-radius: 18px;
      padding: 20px 22px;
      color: #fff;
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-12px) scale(0.95);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    }
    .control-panel.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .control-panel h3 {
      font-size: 15px;
      margin-bottom: 14px;
      color: #ffd6e0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .control-heading {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .control-group {
      margin-bottom: 13px;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #eae0e8;
      margin-bottom: 6px;
    }
    .control-group input[type=range] {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      appearance: none;
      outline: none;
    }
    .control-group input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ff85a1;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255,133,161,0.9);
    }
    .control-group input[type=color] {
      width: 100%;
      height: 32px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    .effect-rgb-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .effect-rgb-row input[type=number] {
      width: 100%;
      min-width: 0;
      height: 32px;
      padding: 4px 6px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font: inherit;
      font-size: 12px;
      cursor: text;
      -webkit-user-select: text;
      user-select: text;
    }
    .effect-rgb-row input:focus-visible {
      outline: 2px solid #ffd6e0;
      outline-offset: 2px;
    }
    .effect-rgb-row input[aria-invalid=true] {
      border-color: #ff85a1;
    }
    .effect-color-help,
    .effect-color-error,
    .effect-theme-status {
      margin-top: 6px;
      font-size: 12px;
      color: #eae0e8;
    }
    .effect-color-error {
      color: #ffd6e0;
    }
    .effect-theme-reset {
      width: 100%;
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      flex: 1;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.22);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      opacity: 0.92;
      box-shadow: 0 0 12px rgba(255,117,140,0.5);
    }
    /* 交互提示 */
    .hint-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 14, 24, 0.6);
      backdrop-filter: blur(10px);
      padding: 7px 18px;
      border-radius: 22px;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
      transition: opacity 1s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="wallpaper-canvas"></canvas>
  </div>

  <div class="ui-toggle-btn" id="toggle-ui-btn" title="控制台">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </div>

  <div class="control-panel" id="control-panel">
    <h3>
      <span aria-hidden="true">🌸</span>
      <span class="control-heading"><span id="wallpaper-project-name">木之本樱 &amp; 小可</span> 壁纸控制台</span>
    </h3>
    <div class="control-group">
      <label>飘落花瓣数量 <span id="val-petal-count">75</span></label>
      <input type="range" id="param-petal-count" min="15" max="180" value="75">
    </div>
    <div class="control-group">
      <label>微风风力 <span id="val-wind-speed">1.0x</span></label>
      <input type="range" id="param-wind-speed" min="2" max="30" value="10">
    </div>
    <div class="control-group">
      <label>星尘光效 <span id="val-sparkle-intensity">1.2x</span></label>
      <input type="range" id="param-sparkle-intensity" min="0" max="25" value="12">
    </div>
    <div class="control-group">
      <label>镜头呼吸浮动 <span id="val-camera-zoom">1.0x</span></label>
      <input type="range" id="param-camera-zoom" min="0" max="25" value="10">
    </div>
    <div class="control-group">
      <label>2.5D 视差灵敏度 <span id="val-parallax-sens">1.2x</span></label>
      <input type="range" id="param-parallax-sens" min="0" max="30" value="12">
    </div>
    <div class="control-group">
      <label for="param-effect-color">特效主色</label>
      <input type="color" id="param-effect-color" value="#b8d9f2" aria-describedby="effect-theme-status">
      <div class="effect-rgb-row" role="group" aria-label="特效主色 RGB 数值">
        <div>
          <label for="param-effect-r">R（红）</label>
          <input type="number" id="param-effect-r" min="0" max="255" step="1" inputmode="numeric" value="184" aria-describedby="effect-color-help effect-color-error">
        </div>
        <div>
          <label for="param-effect-g">G（绿）</label>
          <input type="number" id="param-effect-g" min="0" max="255" step="1" inputmode="numeric" value="217" aria-describedby="effect-color-help effect-color-error">
        </div>
        <div>
          <label for="param-effect-b">B（蓝）</label>
          <input type="number" id="param-effect-b" min="0" max="255" step="1" inputmode="numeric" value="242" aria-describedby="effect-color-help effect-color-error">
        </div>
      </div>
      <p class="effect-color-help" id="effect-color-help">RGB：0–255 整数，合法输入即时生效。</p>
      <p class="effect-color-error" id="effect-color-error" role="status" aria-live="polite"></p>
      <p class="effect-theme-status" id="effect-theme-status" role="status" aria-live="polite">自动配色</p>
      <button class="btn effect-theme-reset" id="btn-reset-effect-color" disabled>恢复自动配色</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-fullscreen">切换全屏</button>
      <button class="btn btn-primary" id="btn-record">录制 6s 片段</button>
    </div>
  </div>

  <div class="hint-bar" id="hint-bar">
    ✨ 点击屏幕散落花瓣与星尘 | 移动鼠标体验 2.5D 空间视差
  </div>

  <script id="effect-theme" type="application/json">
    {"primaryColor": "#efb3cd", "brightness": 0.72521}
  </script>
  <script src="wallpaper.js"></script>
</body>
</html>
